server:
  port: 8085
  tomcat:
    uri-encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
spring:
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  application:
    name: ai_chat_web
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen:0.5b
        options:
          temperature: 0.7
    vector-store:
      simple:
        type: memory
  rag:
    knowledge-dir: /Users/liudeqing/knowledge-base  # 可以改成绝对路径:

  datasource:
    url: jdbc:mysql://localhost:3306/baojia?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 19890505
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: MyHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 1000ms
          time-between-eviction-runs: 30000ms
      password: 19890505
      decode_responses: true
      username: default
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    auto-mapping-behavior: partial

logging:
  config: classpath:logback.xml

# CMS 文章：本地上传目录（可改为绝对路径）
baojia:
  cms:
    upload-dir: ${BAOJIA_CMS_UPLOAD_DIR:./uploads/baojia-cms}